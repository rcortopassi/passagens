name: passagens

# Duas chances por hora (minutos 23 e 53), porque o cron do GitHub atrasa e
# as vezes e descartado sob carga: a das 12:23 UTC de 05/08/2026 simplesmente
# nao existiu. O grupo de concorrencia impede rodadas sobrepostas, e em
# repositorio PUBLICO os minutos de Actions nao consomem os 2.000 min/mes da
# conta; foi por isso que o repositorio e publico. Antes de investigar coleta
# sumida, conferir `gh run list` para ver se o run chegou a existir.

on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:

concurrency:
  group: passagens          # duas rodadas juntas corrompem o historico
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Coletar e publicar
        env:
          PA_TOKEN: ${{ secrets.PA_TOKEN }}
          PA_USER: ${{ secrets.PA_USER }}
          PASSAGENS_DATACENTER: "1"
        run: python3 passagens/atualiza.py 2>&1 | tee saida.txt
      - name: Guardar o historico
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add passagens/historico.json
          git diff --staged --quiet || git commit -m "coleta de $(date -u '+%F %H:%M')"
          git pull --rebase --autostash || true
          git push || echo "push falhou; a proxima rodada tenta de novo"

name: passagens

# De hora em hora, no minuto 23 (deslocado do minuto 7 do precos-zfold8 e do
# 37 do takemehome, que rodam na mesma conta). Repositorio PUBLICO de
# proposito: minutos de Actions em repositorio publico nao consomem os 2.000
# min/mes da conta, entao a rodada horaria cabe sem apertar ninguem.
# O cron do GitHub atrasa e as vezes e descartado sob carga; antes de
# investigar coleta sumida, conferir `gh run list` para ver se o run existiu.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: passagens          # duas rodadas juntas corrompem o historico
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Coletar e publicar
        env:
          PA_TOKEN: ${{ secrets.PA_TOKEN }}
          PA_USER: ${{ secrets.PA_USER }}
          PASSAGENS_DATACENTER: "1"
        run: python3 passagens/atualiza.py 2>&1 | tee saida.txt
      - name: Guardar o historico
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add passagens/historico.json
          git diff --staged --quiet || git commit -m "coleta de $(date -u '+%F %H:%M')"
          git pull --rebase --autostash || true
          git push || echo "push falhou; a proxima rodada tenta de novo"
